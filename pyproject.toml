[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-market-monitoring"
version = "1.0.0"
description = "Market monitoring plugin for Alliance Auth: fit availability, deficit and Jita buyback cost."
requires-python = ">=3.11"
dependencies = [
    "allianceauth>=5.0,<6.0",
    "django-eveuniverse>=1.5",
    "requests>=2.31",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["marketmonitoring*"]
exclude = ["testproject*"]

# Шаблоны, статические файлы и каталоги переводов должны попадать в wheel/sdist.
# Без этого Django не находит marketmonitoring/dashboard.html после pip install.
[tool.setuptools.package-data]
marketmonitoring = [
    "templates/**/*.html",
    "static/**/*",
    "locale/**/*",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
